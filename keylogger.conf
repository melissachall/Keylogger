# MEL Keylogger Configuration File
# Rename this file to "keylogger.conf" and fill in your credentials

[EMAIL]
# Email address for sending and receiving logs
address = your_email@outlook.com

# Email password or app-specific password
# For Gmail: Use App Password (https://support.google.com/accounts/answer/185833)
# For Outlook: Use regular password or App Password
password = your_password_here

# SMTP server configuration
smtp_host = smtp.office365.com
smtp_port = 587

# Common SMTP configurations:
# - Outlook/Hotmail: smtp.office365.com:587
# - Gmail: smtp.gmail.com:587
# - Yahoo: smtp.mail.yahoo.com:587
# - Custom: your.smtp.server:port
